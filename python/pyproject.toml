[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qroid-qr"
version = "0.1.0"
description = "Tiny QR code generator — square or round modules, SVG / PNG base64 / ASCII. From Qroid."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Qroid" }]
keywords = ["qr", "qrcode", "qroid", "svg", "png", "ascii"]
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://qroid.com"
Documentation = "https://qroid.com/en/developers"
Repository = "https://github.com/qroid-com/qroid-qr"

[project.scripts]
qroid-qr = "qroid_qr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
